<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tap Flappy Pro - Shastry Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            margin-bottom: 10px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: #fbbf24;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 580px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #334155;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .controls-info {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Tap Flappy Pro</h1>
    </div>

    <div id="game-container">
        <canvas id="flappyCanvas" width="400" height="580"></canvas>
    </div>

    <div class="controls-info">
        📱 Mobile: Tap Screen | 💻 Desktop: Click / Spacebar
    </div>

    <script>
        const canvas = document.getElementById('flappyCanvas');
        const ctx = canvas.getContext('2d');

        // Web Audio API Synthesizer for zero-latency Sound FX
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'flap') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'score') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.25);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        // Entities & Game State
        let bird = { 
            x: 90, 
            y: 260, 
            radius: 14, 
            vy: 0, 
            gravity: 0.42, 
            flapPower: -7.2, 
            angle: 0,
            wingAngle: 0
        };
        
        let pipes = [];
        let coins = [];
        let particles = [];
        let clouds = [
            { x: 50, y: 80, speed: 0.4, scale: 0.8 },
            { x: 220, y: 140, speed: 0.6, scale: 1.1 },
            { x: 340, y: 60, speed: 0.3, scale: 0.7 }
        ];

        let frame = 0;
        let score = 0;
        let coinCount = 0;
        let highScore = localStorage.getItem('shastry_flappy_high') || 0;
        let gameOver = false;
        let gameStarted = false;
        let shakeFrames = 0;
        let groundScroll = 0;

        const pipeWidth = 58;
        const pipeSpeed = 2.4;

        function flap() {
            initAudio();
            if (!gameStarted) {
                gameStarted = true;
                bird.vy = bird.flapPower;
                playSound('flap');
                createFlapParticles();
                return;
            }

            if (gameOver) {
                resetGame();
                return;
            }

            bird.vy = bird.flapPower;
            playSound('flap');
            createFlapParticles();
        }

        // Touch & Key Event Listeners
        window.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });
        window.addEventListener('mousedown', flap);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') flap();
        });

        function resetGame() {
            bird.y = 260;
            bird.vy = 0;
            bird.angle = 0;
            pipes = [];
            coins = [];
            particles = [];
            score = 0;
            frame = 0;
            gameOver = false;
            gameStarted = true;
            loop();
        }

        function createFlapParticles() {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: bird.x - 10,
                    y: bird.y + 5,
                    vx: -Math.random() * 2 - 1,
                    vy: Math.random() * 2 - 1,
                    size: Math.random() * 4 + 2,
                    alpha: 1,
                    color: '#ffffff'
                });
            }
        }

        function createHitParticles() {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: bird.x,
                    y: bird.y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 5 + 2,
                    alpha: 1,
                    color: '#f59e0b'
                });
            }
        }

        function spawnPipes() {
            // Dynamic difficulty: pipe gap shrinks slightly as score increases
            const currentGap = Math.max(105, 135 - Math.floor(score / 5) * 3);
            const minHeight = 60;
            const maxHeight = canvas.height - currentGap - minHeight - 60;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - currentGap - 60,
                passed: false
            });

            // 50% chance to spawn a bonus coin inside the pipe gap
            if (Math.random() > 0.5) {
                coins.push({
                    x: canvas.width + pipeWidth / 2,
                    y: topHeight + currentGap / 2,
                    collected: false
                });
            }
        }

        function update() {
            // Update Ambient Clouds
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x < -80) c.x = canvas.width + 40;
            });

            if (!gameStarted || gameOver) return;

            frame++;
            groundScroll = (groundScroll + pipeSpeed) % 20;

            // Bird Physics & Flap Animation
            bird.vy += bird.gravity;
            bird.y += bird.vy;
            bird.angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, bird.vy * 0.08));
            bird.wingAngle = Math.sin(frame * 0.4) * 0.5;

            // Spawn Pipes
            if (frame % 95 === 0) {
                spawnPipes();
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Update Coins
            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.x -= pipeSpeed;
                
                // Collect check
                const dist = Math.hypot(bird.x - c.x, bird.y - c.y);
                if (!c.collected && dist < bird.radius + 10) {
                    c.collected = true;
                    coinCount++;
                    playSound('coin');
                }

                if (c.x < -20) coins.splice(i, 1);
            }

            // Update & Check Pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= pipeSpeed;

                // Score Increment
                if (!p.passed && p.x + pipeWidth < bird.x) {
                    p.passed = true;
                    score++;
                    playSound('score');
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('shastry_flappy_high', highScore);
                    }
                }

                // Collision Box
                const hitX = bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + pipeWidth;
                const hitTop = bird.y - bird.radius < p.top;
                const hitBottom = bird.y + bird.radius > canvas.height - 60 - p.bottom;

                if (hitX && (hitTop || hitBottom)) {
                    triggerGameOver();
                }

                if (p.x + pipeWidth < -10) pipes.splice(i, 1);
            }

            // Floor & Ceiling Hit
            if (bird.y - bird.radius <= 0 || bird.y + bird.radius >= canvas.height - 60) {
                triggerGameOver();
            }
        }

        function triggerGameOver() {
            if (!gameOver) {
                gameOver = true;
                shakeFrames = 15;
                playSound('hit');
                createHitParticles();
            }
        }

        function drawCloud(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.arc(18, -10, 16, 0, Math.PI * 2);
            ctx.arc(36, 0, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.save();

            // Screen Shake Effect on Impact
            if (shakeFrames > 0) {
                const dx = (Math.random() - 0.5) * 8;
                const dy = (Math.random() - 0.5) * 8;
                ctx.translate(dx, dy);
                shakeFrames--;
            }

            // Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height - 60);
            skyGrad.addColorStop(0, '#0ea5e9');
            skyGrad.addColorStop(1, '#7dd3fc');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background Clouds
            clouds.forEach(c => drawCloud(c.x, c.y, c.scale));

            // Pipes
            pipes.forEach(p => {
                const pipeGrad = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
                pipeGrad.addColorStop(0, '#15803d');
                pipeGrad.addColorStop(0.3, '#22c55e');
                pipeGrad.addColorStop(1, '#166534');

                ctx.fillStyle = pipeGrad;

                // Top Pipe
                ctx.fillRect(p.x, 0, pipeWidth, p.top);
                ctx.fillRect(p.x - 4, p.top - 20, pipeWidth + 8, 20);

                // Bottom Pipe
                const bottomY = canvas.height - 60 - p.bottom;
                ctx.fillRect(p.x, bottomY, pipeWidth, p.bottom);
                ctx.fillRect(p.x - 4, bottomY, pipeWidth + 8, 20);
            });

            // Bonus Coins
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 9, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ca8a04';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // Ground & Grass Line
            const groundGrad = ctx.createLinearGradient(0, canvas.height - 60, 0, canvas.height);
            groundGrad.addColorStop(0, '#eab308');
            groundGrad.addColorStop(1, '#ca8a04');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, canvas.height - 60, canvas.width, 60);

            // Animated Grass Top Strip
            ctx.fillStyle = '#16a34a';
            ctx.fillRect(0, canvas.height - 60, canvas.width, 10);
            ctx.fillStyle = '#22c55e';
            for (let x = -groundScroll; x < canvas.width; x += 20) {
                ctx.beginPath();
                ctx.moveTo(x, canvas.height - 50);
                ctx.lineTo(x + 10, canvas.height - 60);
                ctx.lineTo(x + 20, canvas.height - 50);
                ctx.fill();
            }

            // Draw Bird
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.angle);

            // Body
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#b45309';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Wing Animation
            ctx.fillStyle = '#d97706';
            ctx.beginPath();
            ctx.ellipse(-4, 2, 8, 5, bird.wingAngle, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(6, -4, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(10, -1);
            ctx.lineTo(18, 3);
            ctx.lineTo(10, 7);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            // Active Score Display
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.font = '900 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.strokeText(score, canvas.width / 2, 60);
            ctx.fillText(score, canvas.width / 2, 60);

            // Coin counter HUD
            ctx.font = '700 16px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillStyle = '#facc15';
            ctx.fillText(`🪙 ${coinCount}`, 15, 30);

            // Overlay Screen Layouts
            if (!gameStarted) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Tap or Click to Fly!', canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = '14px sans-serif';
                ctx.fillStyle = '#cbd5e1';
                ctx.fillText('Avoid the pipes & collect bonus coins', canvas.width / 2, canvas.height / 2 + 20);
            } else if (gameOver) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffffff';
                ctx.font = '900 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

                // Scoreboard Card
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.roundRect(canvas.width / 2 - 110, canvas.height / 2 - 20, 220, 100, 10);
                ctx.fill();
                ctx.stroke();

                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText(`Score:`, canvas.width / 2 - 50, canvas.height / 2 + 10);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText(score, canvas.width / 2 + 40, canvas.height / 2 + 10);

                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText(`Best:`, canvas.width / 2 - 50, canvas.height / 2 + 40);
                ctx.fillStyle = '#fbbf24';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText(highScore, canvas.width / 2 + 40, canvas.height / 2 + 40);

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '14px sans-serif';
                ctx.fillText('Tap to Play Again', canvas.width / 2, canvas.height / 2 + 110);
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(loop);
            }
        }

        loop();
    </script>
</body>
</html>
